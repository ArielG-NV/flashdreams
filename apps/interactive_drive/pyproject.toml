[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-interactive-drive"
version = "0.1.0"
description = "Reusable transport-neutral FlashDreams interactive driving application"
requires-python = ">=3.10"
dependencies = [
    "flashdreams[local-window,serving]",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[tool.uv.sources]
flashdreams = { workspace = true }

[tool.setuptools]
packages = ["interactive_drive"]
package-dir = { interactive_drive = "." }
