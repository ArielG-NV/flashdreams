[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-imgui-demo"
version = "0.1.0"
description = "Interactive Dear ImGui demo for the FlashDreams v2 runtime."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams[local-window,serving,ui]",
]

[project.entry-points."flashdreams.applications_v2"]
"imgui-demo" = "imgui_demo.app:create_app"
"imgui-frame-sharing" = "imgui_demo.frame_sharing_app:create_app"
"imgui-message" = "imgui_demo.message_app:create_app"

[tool.uv.sources]
flashdreams = { workspace = true }

[tool.setuptools.packages.find]
include = ["imgui_demo*"]

[tool.uv]
managed = true
