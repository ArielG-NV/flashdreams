[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdreams-null-model"
version = "0.1.0"
description = "Deterministic CPU-safe NULL model integration for FlashDreams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flashdreams",
]

[tool.uv.sources]
flashdreams = { workspace = true }

[tool.setuptools.packages.find]
include = ["null_model*"]

[tool.uv]
managed = true
